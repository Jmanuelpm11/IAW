limit_req_zone $binary_remote_addr zone=nimbus_zone:10m rate=0r/s;

# 1. Redirección HTTP a HTTPS
server {
    listen 80;
    server_name docs.nimbus.local priv.nimbus.local;
    return 301 https://$host$request_uri;
}

# 2. Servidor HTTPS Principal (Para peticiones reales o con --resolve)
server {
    listen 443 ssl;
    server_name docs.nimbus.local priv.nimbus.local;

    ssl_certificate /etc/nginx/certs/nimbus.crt;
    ssl_certificate_key /etc/nginx/certs/nimbus.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        limit_req zone=nimbus_zone burst=4 nodelay;
        proxy_pass http://apache-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}


server {
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/nimbus.crt;
    ssl_certificate_key /etc/nginx/certs/nimbus.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://apache-backend:8080;
        proxy_set_header Host docs.nimbus.local;
        proxy_set_header X-Real-IP $remote_addr;
    }
}


server {
    listen 8444 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/nimbus.crt;
